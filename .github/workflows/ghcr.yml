name: Build and push GHCR images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image_suffix: backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image_suffix: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          # Flat names (owner/repo-suffix) — nested owner/repo/suffix packages
          # cannot be made public on GHCR, so CapRover pulls fail with 401/not found.
          echo "name=${{ env.REGISTRY }}/${OWNER}/${REPO}-${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"
          echo "package=${REPO}-${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve frontend API URL
        id: api_url
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "value=${{ vars.NEXT_PUBLIC_API_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=https://crm-server.dartcodes.cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api_url.outputs.value }}

      - name: Make GHCR package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG="${{ steps.image.outputs.package }}"
          # Prefer org API, fall back to user API.
          for SCOPE in "orgs/${OWNER}" "users/${OWNER}"; do
            if gh api "${SCOPE}/packages/container/${PKG}" >/dev/null 2>&1; then
              echo "Setting ${SCOPE}/packages/container/${PKG} visibility=public"
              gh api --method PATCH "${SCOPE}/packages/container/${PKG}" -f visibility=public || true
              exit 0
            fi
          done
          echo "Package ${PKG} not found yet (will be publicizable after first push)."
