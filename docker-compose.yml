services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crmtool-backend:local
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: crmtool-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
